[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

; Include order is load-bearing. Later files override earlier ones, which is how
; generated values beat the placeholders they ship alongside:
;   1  LuneSettings   what the user chose
;   2  LuneResolved   the palette and geometry resolved from that choice
;   3  LuneLive       the figures from the last poll
;   4  LuneMark       the brand mark, drawn from LogoPx in LuneResolved
;   5  the layout     selected by name, so each size is a hand-built panel
@Include=#@#LuneSettings.inc
@Include2=#@#LuneResolved.inc
@Include3=#@#LuneLive.inc
@Include4=#@#LuneMark.inc
@Include5=#@#Layouts\Lune#Size#.inc

OnRefreshAction=[!CommandMeasure MeasureLunePoll "Run"]

; ---- context menu ----------------------------------------------------------
; Grouped as actions / size / theme / opacity / rows / files. A filled circle
; marks the active choice. Those marks and the two toggle labels are written into
; LuneResolved.inc by the poller, so the menu reports the current state instead of
; listing every option twice.
;
; Every setting routes through MeasureLuneApply, whose FinishAction refreshes only
; once the file has actually been rewritten; refreshing inline would race it.
;
; Numbering must be sequential and unique - a gap silently truncates the menu, so
; the separators carry a harmless action rather than being left bare.

ContextTitle=Refresh now
ContextAction=[!SetVariable Refreshing 1][!UpdateMeasure MeasureLuneStatusDot][!UpdateMeter LuneDot][!Redraw][!CommandMeasure MeasureLuneForce "Run"]
; Signing in is the one thing the panel cannot do for itself, so it is one click
; rather than an instruction to go and read somewhere else.
ContextTitle2=Sign in to Claude Code...
ContextAction2=[!CommandMeasure MeasureLuneLogin "Run"]
ContextTitle3=Settings...
ContextAction3=[!CommandMeasure MeasureLuneSettings "Run"]
ContextTitle4=Open Claude usage page
ContextAction4=["#UsageUrl#"]
ContextTitle5=New Claude chat
ContextAction5=[!CommandMeasure MeasureLuneChat "Run"]
ContextTitle6=-
ContextAction6=[!Redraw]
ContextTitle7=#MarkSizeSmall# Small
ContextAction7=[!WriteKeyValue Variables Size Small "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle8=#MarkSizeNormal# Normal
ContextAction8=[!WriteKeyValue Variables Size Normal "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle9=#MarkSizeWide# Wide
ContextAction9=[!WriteKeyValue Variables Size Wide "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle10=#MarkSizeLarge# Large
ContextAction10=[!WriteKeyValue Variables Size Large "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle11=-
ContextAction11=[!Redraw]
ContextTitle12=#MarkThemeDark# Dark
ContextAction12=[!WriteKeyValue Variables Theme Dark "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle13=#MarkThemeAmoled# Amoled
ContextAction13=[!WriteKeyValue Variables Theme Amoled "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle14=#MarkThemeGlass# Glass
ContextAction14=[!WriteKeyValue Variables Theme Glass "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle15=#MarkThemeLight# Light
ContextAction15=[!WriteKeyValue Variables Theme Light "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle16=#MarkThemeClay# Clay
ContextAction16=[!WriteKeyValue Variables Theme Clay "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle17=#MarkThemeMatrix# Matrix
ContextAction17=[!WriteKeyValue Variables Theme Matrix "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle18=#MarkThemeiOS# iOS
ContextAction18=[!WriteKeyValue Variables Theme iOS "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle19=-
ContextAction19=[!Redraw]
ContextTitle20=#MarkOpacitySolid# Solid
ContextAction20=[!WriteKeyValue Variables Opacity 255 "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle21=#MarkOpacityNormal# Normal opacity
ContextAction21=[!WriteKeyValue Variables Opacity 240 "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle22=#MarkOpacityTranslucent# Translucent
ContextAction22=[!WriteKeyValue Variables Opacity 170 "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle23=#MarkOpacityGhost# Ghost
ContextAction23=[!WriteKeyValue Variables Opacity 110 "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle24=-
ContextAction24=[!Redraw]
ContextTitle25=#ScopedToggleLabel#
ContextAction25=[!WriteKeyValue Variables ShowScoped #ScopedToggleValue# "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle26=#FableToggleLabel#
ContextAction26=[!WriteKeyValue Variables ShowFable #FableToggleValue# "#@#LuneSettings.inc"][!CommandMeasure MeasureLuneApply "Run"]
ContextTitle27=-
ContextAction27=[!Redraw]
ContextTitle28=Open data folder
ContextAction28=["%APPDATA%\ClaudeLune"]
ContextTitle29=Edit settings file
ContextAction29=["notepad.exe" "#@#LuneSettings.inc"]

[Metadata]
Name=ClaudeLune
Author=Lunez
Version=1.2.0
License=MIT
Information=Live Claude Code usage limits - session, weekly and per-model. Uses the credentials Claude Code already holds, so there is nothing to configure. Four layouts, seven themes, and every dimension adjustable from the settings window.

; ============================================================================
; MEASURES - shared by every layout          -- luneswan --
; ============================================================================

; The scheduled poll.
;
; There are two of these, differing only by -Force, and that duplication is
; deliberate rather than overlooked. Collapsing them into one measure carrying the
; argument in a variable was built and tested, and it does not work: RunCommand
; captures its Parameter when the skin loads and never re-reads it, so the
; variable was still empty at Run time and -Force silently vanished. Setting the
; variable, updating the measure and waiting three seconds before running made no
; difference - the refresh marker moved every time, which it only does when the
; poll was NOT told to suppress the refresh.
;
; A merged version would have looked perfectly healthy while the Refresh button
; quietly stopped bypassing the throttle. Two measures, honestly duplicated, beat
; one that is subtly wrong.
[MeasureLunePoll]
Measure=Plugin
Plugin=RunCommand
Program=#PowerShellExe#
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#ScriptPath#"
State=Hide
OutputType=UTF8
Timeout=30000
DynamicVariables=1

; A user-initiated refresh. Separate because it carries -Force: the scheduled path
; deliberately honours the throttle window, and reusing it for the button meant the
; button did nothing during a backoff.
;
; Refreshing is set by the caller and cleared here on FinishAction, so the
; indicator reflects a request that is actually in flight. RunCommand is
; asynchronous, so the panel stays interactive throughout.
[MeasureLuneForce]
Measure=Plugin
Plugin=RunCommand
Program=#PowerShellExe#
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#ScriptPath#" -Force
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!SetVariable Refreshing 0][!UpdateMeasure MeasureLuneStatusDot][!UpdateMeter LuneDot][!Redraw]
DynamicVariables=1

; The settings window, launched through a VBScript shim so it is neither a child
; of this measure nor preceded by a console flash.
;
; A RunCommand measure OWNS the process it starts, and Apply refreshes the skin,
; which tears the measure down and took the window with it. "cmd /c start"
; detached it but flashed a console for as long as cmd lived. WScript.Shell.Run
; hides and detaches in a single call. See Start-LuneSettings.vbs.
;
; Timeout is not zero: on a RunCommand measure, zero means kill immediately, not
; "no limit", and the window never appeared.
[MeasureLuneSettings]
Measure=Plugin
Plugin=RunCommand
Program=wscript.exe
Parameter="#@#Scripts\Start-LuneSettings.vbs"
State=Hide
Timeout=10000

; Regenerates LuneResolved.inc, then refreshes. Anything that changes Size or
; Theme must go through here: the layout is chosen by an @Include resolved at load
; time, so a bare refresh is not enough.
[MeasureLuneApply]
Measure=Plugin
Plugin=RunCommand
Program=#PowerShellExe#
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#ScriptPath#" -ResolveOnly
State=Hide
Timeout=15000
FinishAction=[!Refresh]
DynamicVariables=1

; Opens a terminal sitting in Claude Code, where /login is typed. There is no
; non-interactive sign-in: the CLI has no "login" subcommand, and setup-token
; produces an inference-scoped token the usage endpoint refuses with 403.
; /k rather than /c so the window stays up for the browser round trip.
[MeasureLuneLogin]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
; start, so the console is detached and outlives this measure. A RunCommand
; measure owns the process it launches, and an interactive shell never exits -
; held directly it would be killed by the next Apply, or hold the poll open.
Parameter=/c start "Claude Code - type /login" cmd /k "#ClaudeExe#"
State=Hide
Timeout=5000

[MeasureLuneChat]

Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c start "" "#ClaudeExe#"
State=Hide
Timeout=5000

; Ticks the scheduled poll. The poller has its own adaptive interval on top of
; this, so a short RefreshInterval costs a process, not a request.
[MeasureLuneTick]
Measure=Calc
Formula=(MeasureLuneTick % #RefreshInterval#) + 1
IfCondition=(MeasureLuneTick = #RefreshInterval#)
IfTrueAction=[!CommandMeasure MeasureLunePoll "Run"]
DynamicVariables=1

; ---- why there is no bar animation here, settled ------------------------------
;
; Values only reach this skin through a reload, and a reload resets variables, so
; easing needs values that arrive without one. Rainmeter offers exactly one route
; for that: a RunCommand measure takes the value of whatever its process prints.
; The poller printed one line, a String measure picked the number out of it with
; RegExpSubstitute, and an ActionTimer eased the bars toward it.
;
; It animated - three distinct frames in a twenty-frame sample - and it was wrong.
; Two independent measurements, each reading the parsed value back rather than
; watching the motion:
;
;   through a variable      PanelH=(... + [MeasureX])        gave -9 for 58
;   through a meter option  Shape=Rectangle 0,0,#W#,(300 + [MeasureX])
;                                                            gave an invalid
;                                                            formula; the panel
;                                                            shape collapsed to
;                                                            nothing
;
; The reason is in Rainmeter itself: [MeasureName] inside a formula uses a
; measure's NUMERIC value, and a String measure's number is zero no matter what
; Substitute does to its text. Substitute rewrites the string; the formula never
; sees it. There is no supported way to turn printed output into a number a Shape
; formula can use.
;
; So the bars read the published figures and change on reload. If you return to
; this, verify the PARSED VALUE first - motion proves nothing.

; Bar colours are blended by the poller from the active theme's palette and arrive
; ready to use, so these measures only decide between "there is a real limit here"
; and "there is not". The old three-step switch is gone: it made a bar sit flat
; until it crossed 75% and then jump, which never looked like it tracked the fill.
[MeasureLuneSessionTint]
Measure=Calc
Formula=#FiveHourAvailable#
IfCondition=(#FiveHourAvailable# < 1)
IfTrueAction=[!SetVariable ColorFive "#OffColor#"]
IfCondition2=(#FiveHourAvailable# >= 1)
IfTrueAction2=[!SetVariable ColorFive "#BarColorFive#"]
DynamicVariables=1

[MeasureLuneWeeklyTint]
Measure=Calc
Formula=#SevenDayAvailable#
IfCondition=(#SevenDayAvailable# < 1)
IfTrueAction=[!SetVariable ColorSeven "#OffColor#"]
IfCondition2=(#SevenDayAvailable# >= 1)
IfTrueAction2=[!SetVariable ColorSeven "#BarColorSeven#"]
DynamicVariables=1

; The third row only carries a real figure if this plan has a scoped limit.
[MeasureLuneScopedTint]
Measure=Calc
Formula=#ScopedAvailable#
IfCondition=(#ScopedAvailable# < 1)
IfTrueAction=[!SetVariable ColorScoped "#OffColor#"][!SetVariable ScopedValue "n/a"]
IfCondition2=(#ScopedAvailable# >= 1)
IfTrueAction2=[!SetVariable ColorScoped "#BarColorThird#"][!SetVariable ScopedValue "#ScopedShown#% #UsageWord#"]
DynamicVariables=1

; Every matching IfCondition fires, in order, so a later one overrides an earlier.
; That layering is deliberate and the order below is the priority order.
[MeasureLuneStatusDot]
Measure=Calc
Formula=#StatusOk#
IfCondition=(#StatusOk# < 1)
IfTrueAction=[!SetVariable DotColor "#CritColor#"][!UpdateMeter LuneDot][!Redraw]
IfCondition2=(#StatusOk# >= 1)
IfTrueAction2=[!SetVariable DotColor "#NormalColor#"][!UpdateMeter LuneDot][!Redraw]
; Waiting is not failing. A reading that has gone stale because Claude Code is
; closed is amber, not red: the panel is showing the last figures it took, and the
; next poll brings it current. Red here sent people looking for a fault.
IfCondition3=(#IsStale# = 1)
IfTrueAction3=[!SetVariable DotColor "#WarnColor#"][!UpdateMeter LuneDot][!Redraw]
; A Free account has nothing to plot and no fault to report, and a red indicator
; would send the user hunting for a problem that does not exist.
IfCondition4=(#StatusFree# = 1)
IfTrueAction4=[!SetVariable DotColor "#Dim#"][!UpdateMeter LuneDot][!Redraw]
; Last of all, so an in-flight refresh outranks every resting colour. This is the
; loading indicator: the dot takes the accent while a request is out, which is the
; only feedback available on a panel with no room for a spinner.
IfCondition5=(#Refreshing# = 1)
IfTrueAction5=[!SetVariable DotColor "#Accent#"][!UpdateMeter LuneDot][!Redraw]
DynamicVariables=1
